<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🌱 Juego Lavanda</title>
    <style>
        :root {
            --morado: #7c5cbf;
            --oscuro: #2e1a0e;
            --claro: #f3f0f8;
        }

        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            background: var(--claro);
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px 10px;
            color: var(--oscuro);
            touch-action: none;
        }

        h1 { font-size: 28px; color: var(--morado); margin-bottom: 6px; }
        .subtitulo { font-size: 14px; color: #888; margin-bottom: 16px; }

        .panel {
            display: flex;
            gap: 25px;
            margin-bottom: 12px;
            font-size: 16px;
            font-weight: bold;
        }
        .panel span { color: var(--morado); }

        canvas {
            border: 3px solid var(--morado);
            border-radius: 12px;
            background: #1a0e2e;
            display: block;
            max-width: 100%;
            height: auto;
            touch-action: none;
        }

        .controles {
            margin-top: 14px;
            font-size: 13px;
            color: #888;
            text-align: center;
        }

        #pantallaFin {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.75);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .caja-fin {
            background: white;
            border-radius: 20px;
            padding: 35px 40px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            max-width: 90%;
        }

        .caja-fin button {
            padding: 12px 28px;
            margin: 8px 5px;
            background: var(--morado);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
        }

        a.volver {
            display: inline-block;
            margin-top: 20px;
            font-size: 14px;
            color: var(--morado);
            text-decoration: none;
        }
    </style>
</head>
<body>

    <h1>🌸 Lluvia de Lavanda</h1>
    <p class="subtitulo">¡Atrapa las flores y evita las plagas!</p>

    <div class="panel">
        <div>⭐ Puntos: <span id="puntos">0</span></div>
        <div>❤️ Vidas: <span id="vidas">3</span></div>
        <div>🌸 Nivel: <span id="nivel">1</span></div>
    </div>

    <canvas id="canvas" width="480" height="500"></canvas>

    <p class="controles">
        👆 Mueve con el dedo · Toca rápido arriba para pausar
    </p>

    <a class="volver" href="index.html">← Volver a Lavanda App</a>

    <div id="pantallaFin">
        <div class="caja-fin">
            <h2 id="emojiResultado">😢</h2>
            <h2 id="tituloFin">¡Game Over!</h2>
            <p>Obtuviste <strong id="puntajeFinal">0</strong> puntos</p>
            <button onclick="reiniciar()">🔄 Jugar de nuevo</button>
            <button onclick="window.location.href='index.html'" style="background:#95a5a6;">🏠 Inicio</button>
        </div>
    </div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let puntos = 0, vidas = 3, nivel = 1;
let pausado = false;
let corriendo = true;
let mouseX = canvas.width / 2;

const cesta = { x: canvas.width/2, y: canvas.height-50, w: 90, h: 22, color: "#7c5cbf" };
let items = [], particulas = [];

// ==================== EVENTOS TOUCH Y MOUSE ====================

let lastTap = 0;
let touchStartY = 0;

canvas.addEventListener("mousemove", e => {
    const rect = canvas.getBoundingClientRect();
    mouseX = e.clientX - rect.left;
});

canvas.addEventListener("touchstart", e => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    mouseX = e.touches[0].clientX - rect.left;
    touchStartY = e.touches[0].clientY;

    // Detectar toque rápido (tap) para pausar
    const now = Date.now();
    if (now - lastTap < 300 && touchStartY < canvas.height * 0.4) { // Solo en la parte superior
        pausado = !pausado;
    }
    lastTap = now;
});

canvas.addEventListener("touchmove", e => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    mouseX = e.touches[0].clientX - rect.left;
});

canvas.addEventListener("touchend", e => e.preventDefault());

// ==================== RESTO DEL JUEGO ====================

const TIPOS = {
    flor1: { emoji:"🌸", puntos:10, malo:false },
    flor2: { emoji:"💜", puntos:15, malo:false },
    flor3: { emoji:"🌺", puntos:20, malo:false },
    plaga: { emoji:"🐛", puntos:-1, malo:true },
    piedra: { emoji:"🪨", puntos:-1, malo:true }
};

function tipoAleatorio(){
    const pMala = Math.min(0.15 + nivel * 0.05, 0.45);
    return Math.random() < pMala ? 
        (Math.random() < 0.5 ? "plaga" : "piedra") :
        ["flor1","flor2","flor3"][Math.floor(Math.random()*3)];
}

function crearItem(){
    const tipo = tipoAleatorio();
    const info = TIPOS[tipo];
    items.push({
        x: 20 + Math.random()*(canvas.width-40),
        y: -30,
        vy: 1.7 + Math.random() * nivel * 0.8,
        emoji: info.emoji,
        puntos: info.puntos,
        malo: info.malo,
        size: 30
    });
}

function explotar(x, y, color){
    for(let i=0; i<10; i++){
        const ang = Math.random()*Math.PI*2;
        particulas.push({
            x, y,
            vx: Math.cos(ang)*(2+Math.random()*3),
            vy: Math.sin(ang)*(2+Math.random()*3)-1,
            vida: 28,
            color
        });
    }
}

const estrellas = Array.from({length:50}, () => ({
    x: Math.random()*canvas.width,
    y: Math.random()*canvas.height,
    r: Math.random()*1.6 + 0.4,
    op: Math.random()
}));

function loop(){
    if(!corriendo) return;
    requestAnimationFrame(loop);

    if(pausado){
        ctx.fillStyle = "rgba(0,0,0,0.6)";
        ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = "white";
        ctx.font = "bold 36px Segoe UI";
        ctx.textAlign = "center";
        ctx.fillText("⏸ PAUSA", canvas.width/2, canvas.height/2);
        ctx.font = "18px Segoe UI";
        ctx.fillText("Toca arriba para continuar", canvas.width/2, canvas.height/2 + 50);
        return;
    }

    // Fondo
    ctx.fillStyle = "#1a0e2e";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    // Estrellas
    estrellas.forEach(s => {
        s.op = Math.max(0.2, Math.min(1, s.op + (Math.random()-0.5)*0.1));
        ctx.globalAlpha = s.op;
        ctx.fillStyle = "#e8d0ff";
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
        ctx.fill();
    });
    ctx.globalAlpha = 1;

    // Mover cesta
    cesta.x += (mouseX - cesta.x) * 0.25;
    cesta.x = Math.max(45, Math.min(canvas.width-45, cesta.x));

    // Dibujar cesta
    ctx.fillStyle = cesta.color;
    ctx.roundRect(cesta.x - cesta.w/2, cesta.y, cesta.w, cesta.h, 8);
    ctx.fill();
    ctx.fillStyle = "#5a3e8a";
    ctx.roundRect(cesta.x - cesta.w/2, cesta.y, cesta.w, 8, 4);
    ctx.fill();

    // Spawn
    if(Math.random() < 0.04 + nivel*0.009) crearItem();

    // Items
    ctx.font = "30px serif";
    ctx.textAlign = "center";

    items = items.filter(item => {
        item.y += item.vy;

        // Colisión
        if(item.y + item.size/2 >= cesta.y && 
           item.y - item.size/2 <= cesta.y + cesta.h &&
           Math.abs(item.x - cesta.x) < cesta.w/2 + 18){

            if(item.malo){
                vidas--;
                document.getElementById("vidas").textContent = vidas;
                explotar(item.x, item.y, "#ff4757");
                if(vidas <= 0) finDelJuego();
            } else {
                puntos += item.puntos;
                document.getElementById("puntos").textContent = puntos;
                nivel = Math.floor(puntos / 100) + 1;
                document.getElementById("nivel").textContent = nivel;
                explotar(item.x, item.y, "#c8a8ff");
            }
            return false;
        }

        if(item.y > canvas.height + 40){
            if(!item.malo){
                vidas--;
                document.getElementById("vidas").textContent = vidas;
                if(vidas <= 0) finDelJuego();
            }
            return false;
        }

        ctx.fillText(item.emoji, item.x, item.y);
        return true;
    });

    // Partículas
    particulas = particulas.filter(p => {
        p.x += p.vx; p.y += p.vy; p.vy += 0.18; p.vida--;
        ctx.globalAlpha = p.vida / 28;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4.5, 0, Math.PI*2);
        ctx.fill();
        return p.vida > 0;
    });
    ctx.globalAlpha = 1;
}

function finDelJuego(){
    corriendo = false;
    document.getElementById("puntajeFinal").textContent = puntos;

    if(puntos >= 200){
        document.getElementById("emojiResultado").textContent = "🏆";
        document.getElementById("tituloFin").textContent = "¡Increíble!";
    } else if(puntos >= 80){
        document.getElementById("emojiResultado").textContent = "🌸";
        document.getElementById("tituloFin").textContent = "¡Muy bien!";
    } else {
        document.getElementById("emojiResultado").textContent = "😢";
        document.getElementById("tituloFin").textContent = "¡Game Over!";
    }

    document.getElementById("pantallaFin").style.display = "flex";
}

function reiniciar(){
    document.getElementById("pantallaFin").style.display = "none";
    puntos = 0; vidas = 3; nivel = 1; pausado = false; corriendo = true;
    items = []; particulas = [];

    document.getElementById("puntos").textContent = 0;
    document.getElementById("vidas").textContent = 3;
    document.getElementById("nivel").textContent = 1;

    loop();
}

loop();
</script>
</body>
</html>
